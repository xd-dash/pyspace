name: embedded-boundary-benchmark

on:
  workflow_dispatch:
  push:
    branches:
      - codex/embedded-gospace
    paths:
      - "native/**"
      - "src/pyspace/embedded.py"
      - "src/pyspace/native.py"
      - "benchmarks/**"
      - ".github/workflows/benchmark.yml"

permissions:
  contents: read

env:
  GOSPACE_ABI_SHA: dfcdc48324c6ba720918c1c85c1cd46c835affab

jobs:
  boundary:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
      - name: Install pyspace
        run: python -m pip install -e .
      - name: Build matching gospace C ABI
        run: |
          git init /tmp/gospace
          git -C /tmp/gospace remote add origin https://github.com/dash-xd/gospace.git
          git -C /tmp/gospace fetch --depth=1 origin "$GOSPACE_ABI_SHA"
          git -C /tmp/gospace checkout --detach FETCH_HEAD
          cd /tmp/gospace/gospace
          go build -buildmode=c-shared -trimpath -ldflags='-s -w' -o /tmp/libgospace.so ./cmd/cshared
      - name: Benchmark embedded boundary
        run: python benchmarks/embedded_boundary.py /tmp/libgospace.so --iterations 5000
