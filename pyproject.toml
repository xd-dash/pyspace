[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyspace"
version = "0.2.0"
description = "Minimal runtime-composable Python host for Google Cloud Functions"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "Flask>=3.0",
    "Jinja2>=3.1",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/pyspace", "src/cloud_function_app"]
